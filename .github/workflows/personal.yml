name: Promote Personal daily
on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: personal-package-promotion
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'smokkelaar/nocturne-home-assistant'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check whether Personal uses the pinned release rollout
        id: source_mode
        run: |
          if python -c 'import json, pathlib, sys; p = pathlib.Path("release-rollout.json"); sys.exit(0 if p.is_file() and "personal" in json.loads(p.read_text())["channels"] else 1)'; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Personal is pinned to the Nocturne release rollout; source promotion is paused.'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve exact Personal source following the approved Daily
        if: steps.source_mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/update_personal.py --update
          python tools/update_test_channels.py --follow-personal --update
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        id: proposal
        if: steps.source_mode.outputs.enabled == 'true'
        with:
          token: ${{ github.token }}
          branch: automation/nocturne-personal
          title: 'Update Nocturne Personal Release'
          commit-message: 'Prepare pinned Personal source build'
          add-paths: |
            upstream-personal.json
            nocturne_personal
            upstream-test-a.json
            upstream-test-b.json
            upstream-test-c.json
            nocturne_test_a
            nocturne_test_b
            nocturne_test_c
          body: |
            Personal and Test A/B/C source promotion, following the Daily base already accepted here.
            API and web are compiled from the same exact fork commit and archive checksum.
            This proposal is not a passing build: required Validate includes the
            Personal source build and upgrade before protected auto-merge.
            Official/Latest packages, app settings and live data are untouched.
      - name: Dispatch all required checks before protected auto-merge
        if: steps.proposal.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.proposal.outputs.pull-request-branch }}
          PR: ${{ steps.proposal.outputs.pull-request-number }}
        run: |
          gh workflow run validate.yml --ref "$BRANCH"
          gh pr merge "$PR" --auto --squash
