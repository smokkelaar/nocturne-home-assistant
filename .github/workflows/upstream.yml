name: Check Nocturne updates
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-update
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'smokkelaar/nocturne-home-assistant'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Resolve a newer stable upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update_upstream.py --update
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- upstream.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate generated update
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_web_check.mjs
          python tools/update_upstream.py --check
      - name: Build and smoke-test candidate before offering it
        if: steps.changes.outputs.changed == 'true'
        run: |
          docker build --platform linux/amd64 --tag nocturne-ha:candidate nocturne_local
          python tools/smoke.py --image nocturne-ha:candidate
          mkdir -p "$RUNNER_TEMP/nocturne-baseline"
          git archive HEAD nocturne_local | tar -x -C "$RUNNER_TEMP/nocturne-baseline"
          docker build --platform linux/amd64 --tag nocturne-ha:baseline "$RUNNER_TEMP/nocturne-baseline/nocturne_local"
          python tools/recovery_smoke.py --image nocturne-ha:candidate --baseline nocturne-ha:baseline
      - name: Open or refresh reviewed update proposal
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/nocturne-upstream
          title: 'Update Nocturne to the latest stable release'
          commit-message: 'Update paired Nocturne release and HA app version'
          add-paths: |
            upstream.json
            nocturne_local/config.json
            nocturne_local/Dockerfile
            nocturne_local/CHANGELOG.md
            nocturne_local/rootfs/opt/nocturne-ha/version.json
          body: |
            Automatically discovered stable upstream release. API/web pins, source commit,
            HA app version, launcher metadata and changelog are updated together.

            Unit checks, container build, clean startup, authenticated setup and same-version
            restart/persistence, current-main-to-candidate upgrade and cold restore to a new
            disposable volume passed in the [updater run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Fixtures are a setup-only instance and a synthetic row, NOT a real account,
            passkey, Supervisor backup archive, health-data import or clinical compatibility test.

            Maintainer: read upstream release/migration notes, approve PR workflows if GitHub
            requests this, test an upgrade on a backed-up disposable instance, then merge.
            See docs/UPDATES.md. No automatic merge or production installation is performed.
