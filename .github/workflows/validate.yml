name: Validate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested native prebuilt images and prepare the store promotion
        type: boolean
        default: false
      channels:
        description: "changed, all, or comma-separated: official,latest,personal,test-a,test-b,test-c"
        type: string
        default: changed
      force:
        description: Rebuild selected channels even if their fingerprints are unchanged
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.publish && 'prebuilt-publication' || format('validate-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.publish }}
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install Supervisor version parser for HA ordering regression tests
        run: python -m pip install awesomeversion==25.8.0
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_web_check.mjs tests/test_cookies.mjs
      - run: node --test tests/test_personal_cookies.mjs
      - run: python tools/update_upstream.py --check
      - run: python tools/update_latest.py --check
      - run: python tools/update_test_channels.py --check
  maintenance:
    name: Maintenance recovery and ingress (${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prebuilt-select.outputs.maintenance) }}
    needs: prebuilt-select
    if: needs.prebuilt-select.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test maintenance with deliberately broken Nocturne configuration
        run: |
          docker build --build-arg CHANNEL=${{ matrix.channel }} -f tools/personal-maintenance/Dockerfile.smoke -t nocturne-maintenance:ci .
          mkdir "$RUNNER_TEMP/maintenance-data"
          printf '%s' '{"public_url":"invalid","maintenance_enabled":true,"maintenance_password":"ci-disposable-maintenance-password"}' > "$RUNNER_TEMP/maintenance-data/options.json"
          docker run -d --name maintenance-test --cap-add NET_ADMIN -v "$RUNNER_TEMP/maintenance-data:/data" nocturne-maintenance:ci
          trap 'docker rm -f maintenance-test >/dev/null' EXIT
          docker exec -i maintenance-test python3 - < tools/personal-maintenance/container_probe.py
  container-gate:
    name: Container smoke test
    needs: [unit, maintenance, prebuilt, prebuilt-release, prebuilt-select, session-isolation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every container check before promotion
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          MAINTENANCE_RESULT: ${{ needs.maintenance.result }}
          PREBUILT_RESULT: ${{ needs.prebuilt.result }}
          RELEASE_RESULT: ${{ needs.prebuilt-release.result }}
          PREBUILT_CHANGED: ${{ needs.prebuilt-select.outputs.changed }}
          SELECT_RESULT: ${{ needs.prebuilt-select.result }}
          SESSION_RESULT: ${{ needs.session-isolation.result }}
          COOKIE_REQUIRED: ${{ needs.prebuilt-select.outputs.cookies }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          test "$UNIT_RESULT" = success && test "$SELECT_RESULT" = success
          if [ "$PREBUILT_CHANGED" = true ]; then
            test "$MAINTENANCE_RESULT" = success
            if [ "$PUBLISH" = true ]; then test "$RELEASE_RESULT" = success; else test "$PREBUILT_RESULT" = success; fi
          else
            test "$PREBUILT_RESULT" = skipped && test "$RELEASE_RESULT" = skipped && test "$MAINTENANCE_RESULT" = skipped
          fi
          if [ "$PUBLISH" = true ] && [ "$COOKIE_REQUIRED" = true ]; then
            test "$SESSION_RESULT" = success
          else
            test "$SESSION_RESULT" = skipped
          fi
  prebuilt-select:
    name: Select prebuilt candidates
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      changed: ${{ steps.prepare.outputs.changed }}
      maintenance: ${{ steps.prepare.outputs.maintenance }}
      cookies: ${{ steps.prepare.outputs.cookies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install awesomeversion==25.8.0
      - id: prepare
        env:
          WRAPPER_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FORCE: ${{ inputs.force || false }}
          CHANNELS: ${{ inputs.channels || 'changed' }}
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          base="${PR_BASE:-$(git rev-parse origin/main)}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base"
            git cat-file -e "$base^{commit}"
          fi
          extra=()
          mkdir -p work
          if [ "$FORCE" = true ]; then extra+=(--force); fi
          python tools/prebuilt_publish.py prepare --output work/prebuilt --wrapper-commit "$WRAPPER_SHA" --run-number "$RUN_NUMBER" --attempt "$RUN_ATTEMPT" --baseline-ref "$base" --channels "$CHANNELS" "${extra[@]}" > work/prebuilt-matrix.json
          echo "matrix=$(cat work/prebuilt-matrix.json)" >> "$GITHUB_OUTPUT"
          echo "maintenance=$(python -c 'import json; m=json.load(open("work/prebuilt-matrix.json")); print(json.dumps({"include":[{"channel":p} for p in sorted({i["package"] for i in m["include"]})]}))')" >> "$GITHUB_OUTPUT"
          echo "cookies=$(python -c 'import json; m=json.load(open("work/prebuilt-matrix.json")); print(str(any(i["channel"] in ("official","latest","personal") for i in m["include"])).lower())')" >> "$GITHUB_OUTPUT"
          echo "changed=$(python -c 'import json; print(str(bool(json.load(open("work/prebuilt-matrix.json"))["include"])).lower())')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prebuilt-candidates
          path: work/prebuilt
          retention-days: 7
  prebuilt:
    name: Validate (${{ matrix.channel }}/${{ matrix.arch }})
    needs: prebuilt-select
    if: needs.prebuilt-select.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.publish)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prebuilt-select.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/native-prebuilt.yml
    with:
      runner: ${{ matrix.runner }}
      context: ${{ matrix.context }}
      arch: ${{ matrix.arch }}
      channel: ${{ matrix.channel }}
      package: ${{ matrix.package }}
      image: ${{ matrix.image }}
      baseline: ${{ matrix.baseline }}
      legacy_baseline_ref: ${{ matrix.legacy_baseline_ref }}
      publish: false
  prebuilt-release:
    name: Publish (${{ matrix.channel }}/${{ matrix.arch }})
    needs: prebuilt-select
    if: needs.prebuilt-select.outputs.changed == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'smokkelaar/nocturne-home-assistant'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prebuilt-select.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/native-prebuilt.yml
    with:
      runner: ${{ matrix.runner }}
      context: ${{ matrix.context }}
      arch: ${{ matrix.arch }}
      channel: ${{ matrix.channel }}
      package: ${{ matrix.package }}
      image: ${{ matrix.image }}
      baseline: ${{ matrix.baseline }}
      legacy_baseline_ref: ${{ matrix.legacy_baseline_ref }}
      publish: true
  session-isolation:
    name: Session isolation using selected images and published peers
    needs: [prebuilt-release, prebuilt-select]
    if: ${{ !cancelled() && needs.prebuilt-release.result == 'success' && needs.prebuilt-select.outputs.cookies == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prebuilt-candidates
          path: work/prebuilt
      - name: Check all selected cookie channels together without rebuilding peers
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import selected_cookie_smoke as probe
          from prebuilt_publish import read, baseline
          root = Path.cwd()
          candidates = read(root / 'work/prebuilt/candidates.json')
          channel = next(c for c in ('official', 'latest', 'personal') if c in candidates)
          reference = baseline(candidates[channel]['config'], channel, 'amd64', read(root / 'publication.json')['repository'])
          images = probe.references(root, channel, reference, candidates)
          for image in set(images.values()):
              probe.docker('pull', image)
          probe.cookie_smoke.main(**images)
          PY
  prebuilt-promote:
    name: Verify public images and prepare HA store promotion
    needs: [container-gate, prebuilt-select]
    if: always() && needs.container-gate.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish && needs.prebuilt-select.outputs.changed == 'true' && github.repository == 'smokkelaar/nocturne-home-assistant'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      packages: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install awesomeversion==25.8.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prebuilt-candidates
          path: work/prebuilt
      - name: Require anonymous pulls, both native architectures, labels and HA upgrade order
        run: python tools/prebuilt_publish.py promote --candidates work/prebuilt/candidates.json
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        id: proposal
        with:
          base: main
          branch: automation/prebuilt-store
          title: Publish tested prebuilt AMD64 and ARM64 HA images
          commit-message: Publish verified dual-architecture GHCR images in the existing HA store
          add-paths: |
            nocturne_local
            nocturne_latest
            nocturne_personal
            nocturne_test_a
            nocturne_test_b
            nocturne_test_c
          body: |
            Both native architectures passed startup, owner/TOTP recovery and cold-restore/upgrade tests before image publication. Anonymous GHCR pulls and HA image labels were verified for every advertised image.
            The 1.x package series marks prebuilt distribution. Existing repository URL, slugs, options, ports and private data identities are retained. No local HA compilation is required.
      - name: Dispatch protected checks for the publication proposal
        if: steps.proposal.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run validate.yml --ref automation/prebuilt-store -f publish=false -f channels=changed
