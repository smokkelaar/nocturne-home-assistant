name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_web_check.mjs tests/test_cookies.mjs
      - run: node --test tests/test_personal_cookies.mjs
      - run: python tools/update_upstream.py --check
      - run: python tools/update_latest.py --check
      - run: python tools/update_test_channels.py --check
  test-a:
    name: Test A container smoke test
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and smoke-test the pinned PR on Test A
        run: |
          docker build --platform linux/amd64 --tag nocturne-test-a:ci nocturne_test_a
          python3 tools/smoke.py --image nocturne-test-a:ci
  maintenance:
    name: Personal maintenance recovery and ingress
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test maintenance with deliberately broken Nocturne configuration
        run: |
          docker build -f tools/personal-maintenance/Dockerfile.smoke -t nocturne-maintenance:ci .
          mkdir "$RUNNER_TEMP/maintenance-data"
          printf '%s' '{"public_url":"invalid","maintenance_enabled":true,"maintenance_password":"ci-disposable-maintenance-password"}' > "$RUNNER_TEMP/maintenance-data/options.json"
          docker run -d --name maintenance-test --cap-add NET_ADMIN -v "$RUNNER_TEMP/maintenance-data:/data" nocturne-maintenance:ci
          trap 'docker rm -f maintenance-test >/dev/null' EXIT
          docker exec -i maintenance-test python3 - < tools/personal-maintenance/container_probe.py
  google-health:
    name: Test C container smoke test
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and smoke-test the Test C PR source
        run: |
          docker build --platform linux/amd64 --tag nocturne-test-c:ci nocturne_test_c
          python3 tools/smoke.py --image nocturne-test-c:ci
  container:
    name: Core container smoke tests
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Personal changes without changing Daily promotion requirements
        id: personal
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          base="${BASE:-${BEFORE:-origin/main}}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base"
            git cat-file -e "$base^{commit}"
          fi
          if git diff --quiet "$base" HEAD -- nocturne_personal upstream-personal.json tools/update_personal.py tools/cookie_smoke.py tools/personal_feature_probe.py tests/test_personal.py tests/test_personal_cookies.mjs tests/test_cookie_probe.py .github/workflows/personal.yml .github/workflows/validate.yml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile and smoke-test exact Personal source
        if: steps.personal.outputs.changed == 'true'
        run: |
          python3 tools/update_personal.py --check
          docker build --platform linux/amd64 --tag nocturne-personal:ci nocturne_personal
          python3 tools/smoke.py --image nocturne-personal:ci
      - name: Personal features and restart (fail fast before baseline builds)
        if: steps.personal.outputs.changed == 'true'
        run: python3 tools/cookie_smoke.py --personal nocturne-personal:ci
      - name: Build and smoke-test Official channel
        run: |
          docker build --platform linux/amd64 --tag nocturne-official:ci nocturne_local
          python3 tools/smoke.py --image nocturne-official:ci
      - name: Build and smoke-test Latest channel
        run: |
          docker build --platform linux/amd64 --tag nocturne-latest:ci nocturne_latest
          python3 tools/smoke.py --image nocturne-latest:ci
      - name: Build and smoke-test Test B runtime identity
        run: |
          docker build --platform linux/amd64 --tag nocturne-test-b:ci nocturne_test_b
          python3 tools/smoke.py --image nocturne-test-b:ci
      - name: Check out immutable Official baseline release 0.1.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5a1958a6c91991039950d1e3ea7bb28fd3ada35f
          path: .ci-baseline
          persist-credentials: false
      - run: docker build --platform linux/amd64 --tag nocturne-official:baseline .ci-baseline/nocturne_local
      - run: python3 tools/recovery_smoke.py --image nocturne-official:ci --baseline nocturne-official:baseline
      - name: Same-host Official and Latest session isolation
        run: python3 tools/cookie_smoke.py --official nocturne-official:ci --latest nocturne-latest:ci
      - name: Personal cold restore and previous Personal upgrade
        if: steps.personal.outputs.changed == 'true'
        run: |
          if git cat-file -e origin/main:nocturne_personal/config.json 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/personal-baseline"
            git archive origin/main nocturne_personal | tar -x -C "$RUNNER_TEMP/personal-baseline"
            docker build --platform linux/amd64 --tag nocturne-personal:baseline "$RUNNER_TEMP/personal-baseline/nocturne_personal"
          else
            docker tag nocturne-personal:ci nocturne-personal:baseline
            echo 'First Personal delivery: same-version cold restore; no earlier Personal exists.'
          fi
          python3 tools/recovery_smoke.py --image nocturne-personal:ci --baseline nocturne-personal:baseline
      - name: Three real instances share a browser without sharing credentials
        if: steps.personal.outputs.changed == 'true'
        run: python3 tools/cookie_smoke.py --official nocturne-official:ci --latest nocturne-latest:ci --personal nocturne-personal:ci
  container-gate:
    name: Container smoke test
    needs: [unit, google-health, container, maintenance]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every container check before promotion
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          GOOGLE_RESULT: ${{ needs.google-health.result }}
          CORE_RESULT: ${{ needs.container.result }}
          MAINTENANCE_RESULT: ${{ needs.maintenance.result }}
        run: test "$UNIT_RESULT" = success && test "$GOOGLE_RESULT" = success && test "$CORE_RESULT" = success && test "$MAINTENANCE_RESULT" = success
