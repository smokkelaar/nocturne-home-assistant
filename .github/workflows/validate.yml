name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_web_check.mjs
      - run: python tools/update_upstream.py --check
  container:
    name: Container smoke test
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 --tag nocturne-ha:ci nocturne_local
      - run: python3 tools/smoke.py --image nocturne-ha:ci
      - name: Check out immutable baseline release 0.1.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 24c93193bc73a36e8ffd52e3d18a8e1419bc4884
          path: .ci-baseline
          persist-credentials: false
      - run: docker build --platform linux/amd64 --tag nocturne-ha:baseline .ci-baseline/nocturne_local
      - run: python3 tools/recovery_smoke.py --image nocturne-ha:ci --baseline nocturne-ha:baseline
