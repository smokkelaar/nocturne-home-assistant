# Build-time parser/module check only; nginx -t never starts this listener.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
pid /tmp/nocturne-nginx-check.pid;
error_log stderr warn;
events { worker_connections 16; }
http {
    access_log off;
    js_import ha_cookies from /opt/nocturne-ha/cookies.mjs;
    js_set $ha_upstream_cookie ha_cookies.requestCookies;
    server {
        listen 127.0.0.1:18080;
        set $ha_cookie_namespace "NocturneOfficial_";
        location / {
            js_header_filter ha_cookies.responseCookies;
            return 200 "module-check";
        }
    }
}
